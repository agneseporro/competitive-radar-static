const DEEP_ANALYSIS_PROMPT = `You are an expert financial analyst. You will be provided with company annual reports in PDF format (2022, 2023, 2024, and 2025 if available). Your task is to produce a structured multi-year financial analysis focused exclusively on the Mail & Parcel / Parcels & Distribution segment (or closest equivalent). Use consolidated data only as a fallback if segment data is unavailable, and state this clearly.

Work exclusively with information in the provided documents. Do not invent, infer, or assume data not supported by the reports. If information is not available, state this explicitly.

Required output structure — respond in plain text with clear section headers:

## 1. GENERAL OVERVIEW
For each available year, provide a brief overview of performance focusing on: growth/stability/contraction, major events, key operational/strategic developments. Include competitor comparisons only if explicitly mentioned in the reports.

## 2. ANALYSIS BY AREA
For each available year, organize into four areas. For each ratio: state whether reported directly or calculated; give the numerical value and unit; include a brief interpretation (max 2 lines). If a ratio cannot be calculated due to missing data, write "Data not available."

**A. Growth**
- Revenue Growth (%)
- Growth rate of EBITDA or EBIT (specify which)

**B. Solidity**
- Gearing Ratio = Net Financial Position / Equity
- Debt-to-EBITDA = Net Financial Position / EBITDA

**C. Liquidity**
- Current Ratio = Current Assets / Current Liabilities
- Quick Ratio = (Current Assets – Inventories) / Current Liabilities

**D. Profitability**
- RONA = EBIT / Net Assets
- ROE = Net Income / Equity

## 3. THREE-YEAR COMPARISON
For each of the four areas (Growth, Solidity, Liquidity, Profitability), highlight: improvements, deteriorations, key trends, structural changes. Focus on leverage patterns, margin changes, liquidity evolution, capital structure shifts.

## 4. THREE-YEAR FORECAST
Develop three scenarios grounded in the historical evidence:
- **Positive scenario** (expansion): favorable macro/market conditions
- **Neutral scenario**: stable conditions  
- **Negative scenario** (recession): difficult macro and weaker demand

For each scenario and each of the four dimensions (Growth, Solidity, Liquidity, Profitability), indicate: expected direction of change, expected intensity, key drivers. Link each forecast explicitly to historical data from the reports.`;

const ESG_ANALYSIS_PROMPT = `You are an expert in corporate strategy, sustainability and ESG analysis. You will be provided with ESG reports, sustainability reports, and/or strategic documents from a postal/logistics company. Produce a structured strategic and non-financial analysis.

Work exclusively with information in the provided documents. Do not invent or assume data not supported by the reports. If information is not available, state this explicitly.

Required output structure — respond in plain text with clear section headers:

## 1. STRATEGIC POSITIONING
For each available year/document: summarize the company's strategic priorities, vision, and competitive positioning in the mail/parcel segment. What are the declared strategic objectives? What markets and customer segments are targeted? What differentiators are highlighted?

## 2. ESG PERFORMANCE
For each available year/document, analyze:

**A. Environmental**
- CO₂ / emissions targets and progress (Scope 1, 2, 3 where available)
- Renewable energy usage (%)
- Fleet electrification progress
- Packaging and waste reduction initiatives
- Any science-based targets (SBTi) or net-zero commitments

**B. Social**
- Employee headcount and trends
- Employee engagement / satisfaction scores
- Health & safety metrics (injury rates, absenteeism)
- Diversity & inclusion metrics (gender, leadership diversity)
- Community impact programs

**C. Governance**
- Board composition and independence
- Executive remuneration structure (fixed vs variable, ESG-linked)
- Anti-corruption and compliance policies
- Data privacy and cybersecurity governance
- Shareholder structure and any controlling shareholders

## 3. INNOVATION & TECHNOLOGY
- Key technology investments (AI, automation, robotics, data analytics)
- Digital transformation initiatives
- New services or business model innovations
- Patents or R&D spend if disclosed

## 4. COMPETITIVE & MARKET SIGNALS
- Market share data or competitive positioning statements
- Customer satisfaction scores (NPS, CSAT)
- Partnerships, acquisitions, or strategic alliances announced
- Regulatory risks or opportunities mentioned
- Any explicit references to competitors

## 5. MULTI-YEAR COMPARISON & OUTLOOK
Compare the evolution of ESG performance and strategic priorities across the available years. Highlight: improvements, gaps, changes in strategic direction. Identify the 3 most important non-financial risks and 3 most important opportunities for the mail/parcel segment based on the documents.`;

function App() {
  const [activeTab, setActiveTab] = useState("upload");
  const [database, setDatabase] = useState([]);
  const [loading, setLoading] = useState(false);
  const [status, setStatus] = useState({ msg: "", type: "info" });
  const [extractionResult, setExtractionResult] = useState(null);
  const [selectedPeer, setSelectedPeer] = useState("PostNL");
  const [forecast, setForecast] = useState(null);
  const [briefing, setBriefing] = useState(null);
  const [forecastDbVersion, setForecastDbVersion] = useState(0);
  const [briefingDbVersion, setBriefingDbVersion] = useState(0);
  const [dbVersion, setDbVersion] = useState(0);
  const [dragOver, setDragOver] = useState(false);
  const [pdfUrl, setPdfUrl] = useState("");
  const [inputMode, setInputMode] = useState("url");
  const [analysisMode, setAnalysisMode] = useState("single");
  const [multiUrls, setMultiUrls] = useState({ 2022: "", 2023: "", 2024: "", 2025: "" });
  const [esgUrls, setEsgUrls] = useState({ 2022: "", 2023: "", 2024: "", 2025: "" });
  const [deepAnalysis, setDeepAnalysis] = useState({});
  const [esgAnalysis, setEsgAnalysis] = useState({});
  const [deepAnalysisPeer, setDeepAnalysisPeer] = useState(null);
  const [deepTab, setDeepTab] = useState("financial");
  const fileInputRef = useRef();

  useEffect(() => { loadDB(); }, []);

  const loadDB = async () => {
    try { const r = await window.storage.get("ci_db_v2"); if (r?.value) setDatabase(JSON.parse(r.value)); } catch {}
    try { const r = await window.storage.get("ci_deep_analyses"); if (r?.value) setDeepAnalysis(JSON.parse(r.value)); } catch {}
    try { const r = await window.storage.get("ci_esg_analyses"); if (r?.value) setEsgAnalysis(JSON.parse(r.value)); } catch {}
  };

  const saveDB = async (data) => {
    try { await window.storage.set("ci_db_v2", JSON.stringify(data)); } catch {}
  };

  const setMsg = (msg, type = "info") => setStatus({ msg, type });

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const fetchPdfAsBase64 = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Failed to fetch PDF: ${res.status}`);
    const buf = await res.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let binary = "";
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return { b64: btoa(binary), bytes: buf };
  };

  const splitAndExtract = async (url) => {
    setMsg("PDF too large — downloading and splitting...", "info");
    const { PDFDocument } = await import("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js");
    const { b64, bytes } = await fetchPdfAsBase64(url);
    const srcDoc = await PDFDocument.load(bytes);
    const totalPages = srcDoc.getPageCount();
    setMsg(`Splitting ${totalPages} pages into 2 halves...`, "info");
    const mid = Math.floor(totalPages / 2);
    const results = [];
    for (let half = 0; half < 2; half++) {
      const start = half === 0 ? 0 : mid;
      const end = half === 0 ? mid : totalPages;
      const chunk = await PDFDocument.create();
      const pages = await chunk.copyPages(srcDoc, Array.from({ length: end - start }, (_, i) => start + i));
      pages.forEach(p => chunk.addPage(p));
      const chunkBytes = await chunk.save();
      let bin = "";
      new Uint8Array(chunkBytes).forEach(b => bin += String.fromCharCode(b));
      const chunkB64 = btoa(bin);
      setMsg(`Extracting half ${half + 1}/2 (pages ${start + 1}–${end})...`, "info");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1200,
          messages: [{
            role: "user",
            content: [
              { type: "document", source: { type: "base64", media_type: "application/pdf", data: chunkB64 } },
              { type: "text", text: `This is part ${half + 1} of 2 of an annual report. Extract all available Mail & Parcel segment financial data. Focus on: revenues, EBIT, margins, parcel volumes, mail volumes, capex, employees, strategic priorities, key risks, competitive signals, AI/tech highlights. Return structured plain text, label each figure clearly. State "not found in this section" if data is missing.` }
            ]
          }]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      results.push(data.content?.find(c => c.type === "text")?.text || "");
    }
    setMsg("Merging and structuring extracted data...", "info");
    const mergeRes = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `You extracted data from two halves of an annual report. Merge into one JSON. Return ONLY raw JSON, no markdown.

PART 1:\n${results[0]}\n\nPART 2:\n${results[1]}

${EXTRACTION_PROMPT}`
        }]
      })
    });
    const mergeData = await mergeRes.json();
    if (mergeData.error) throw new Error(mergeData.error.message);
    return mergeData.content?.find(c => c.type === "text")?.text || "";
  };

  const processViaUrl = async (url) => {
    if (!url || !url.startsWith("http")) { setMsg("Insert a valid URL starting with https://", "error"); return; }
    setLoading(true);
    setMsg("Sending URL to Claude API...", "info");
    try {
      let text;
      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            messages: [{
              role: "user",
              content: [
                { type: "document", source: { type: "url", url: url } },
                { type: "text", text: EXTRACTION_PROMPT }
              ]
            }]
          })
        });
        const data = await res.json();
        if (data.error?.message?.includes("600") || data.error?.message?.includes("pages")) {
          text = await splitAndExtract(url);
        } else {
          if (data.error) throw new Error(data.error.message);
          text = data.content?.find(c => c.type === "text")?.text || "";
        }
      } catch (e) {
        if (e.message?.includes("600") || e.message?.includes("pages")) {
          text = await splitAndExtract(url);
        } else throw e;
      }
      const extracted = JSON.parse(text.replace(/```json|```/g, "").trim());
      extracted.company = selectedPeer;
      extracted._sourceUrl = url;
      extracted._extractedAt = new Date().toISOString();
      setExtractionResult(extracted);
      setPdfUrl("");
      setMsg("Extraction complete! Review and save.", "success");
    } catch (e) {
      setMsg("Error: " + e.message, "error");
    } finally {
      setLoading(false);
    }
  };

  const processFile = async (file) => {
    if (!file || file.type !== "application/pdf") { setMsg("Please upload a PDF file", "error"); return; }
    setLoading(true);
    setMsg("Converting PDF... (if it fails use URL mode for large files)", "info");
    try {
      const b64 = await fileToBase64(file);
      setMsg("Sending to Claude API for extraction...", "info");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64 } },
              { type: "text", text: EXTRACTION_PROMPT }
            ]
          }]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.content?.find(c => c.type === "text")?.text || "";
      const extracted = JSON.parse(text.replace(/```json|```/g, "").trim());
      extracted.company = selectedPeer;
      extracted._fileName = file.name;
      extracted._extractedAt = new Date().toISOString();
      setExtractionResult(extracted);
      setMsg("Extraction complete! Review and save.", "success");
    } catch (e) {
      if (e.message?.includes("size") || e.message?.includes("large")) {
        setMsg("File too large — switch to URL mode and paste the direct PDF link.", "error");
      } else {
        setMsg("Error: " + e.message, "error");
      }
    } finally {
      setLoading(false);
    }
  };

  const EXTRACT_PER_YEAR_PROMPT = (year) => `You are an expert financial analyst. Extract key financial data from this ${year} annual report, focusing on the Mail & Parcel / Parcels & Distribution segment (or closest equivalent). If segment data is unavailable, use consolidated data and note this.

Return a structured plain-text summary covering:
1. SEGMENT OVERVIEW: segment name used, revenue (€M), revenue growth (%), EBIT (€M), EBIT margin (%), parcel volumes, mail volume change
2. BALANCE SHEET ITEMS: current assets, current liabilities, inventories, equity, net financial position (debt minus cash), EBITDA
3. KEY EVENTS: major strategic events, acquisitions, structural changes in ${year}
4. RATIOS (if explicitly reported): any financial ratios disclosed in the report

Be precise with numbers. State "not available" if data is missing. All figures in EUR millions.`;

  const runDeepAnalysis = async () => {
    const urls = Object.entries(multiUrls).filter(([, v]) => v.trim().startsWith("http"));
    if (urls.length < 2) { setMsg("Add at least 2 annual report URLs to run the deep analysis.", "error"); return; }
    setLoading(true);
    const yearlyExtracts = {};
    try {
      // Step 1: extract each year separately (one PDF per call)
      for (let i = 0; i < urls.length; i++) {
        const [year, url] = urls[i];
        setMsg(`Extracting ${year} data for ${selectedPeer} (${i+1}/${urls.length})...`, "info");
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1500,
            messages: [{
              role: "user",
              content: [
                { type: "document", source: { type: "url", url: url.trim() } },
                { type: "text", text: EXTRACT_PER_YEAR_PROMPT(year) }
              ]
            }]
          })
        });
        const data = await res.json();
        if (data.error?.message?.includes("600") || data.error?.message?.includes("pages")) {
          setMsg(`${year} PDF too large — splitting...`, "info");
          const { PDFDocument } = await import("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js");
          const fetchRes = await fetch(url.trim());
          const buf = await fetchRes.arrayBuffer();
          const srcDoc = await PDFDocument.load(buf);
          const totalPages = srcDoc.getPageCount();
          const mid = Math.floor(totalPages / 2);
          const parts = [];
          for (let half = 0; half < 2; half++) {
            const start = half === 0 ? 0 : mid;
            const end = half === 0 ? mid : totalPages;
            const chunk = await PDFDocument.create();
            const pages = await chunk.copyPages(srcDoc, Array.from({ length: end - start }, (_, k) => start + k));
            pages.forEach(p => chunk.addPage(p));
            const chunkBytes = await chunk.save();
            let bin = ""; new Uint8Array(chunkBytes).forEach(b => bin += String.fromCharCode(b));

          </div>

          {briefing && (
            <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.5rem" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "1.25rem", paddingBottom: "1rem", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                <div>
                  <div style={{ fontSize: "13px", fontWeight: 500 }}>Competitive Intelligence Briefing</div>
                  <div style={{ fontSize: "11px", color: "var(--color-text-tertiary)", marginTop: "2px" }}>
                    Poste Italiane IR Team · {new Date().toLocaleDateString("it-IT", { day: "2-digit", month: "long", year: "numeric" })} · Confidential
                  </div>
                </div>
                <button onClick={() => navigator.clipboard?.writeText(briefing)}
                  style={{ fontSize: "12px", padding: "6px 12px", background: "transparent", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", cursor: "pointer", color: "var(--color-text-secondary)" }}>
                  Copy
                </button>
              </div>
              <div style={{ fontSize: "14px", lineHeight: "1.75", color: "var(--color-text-primary)", whiteSpace: "pre-wrap" }}>
                {briefing}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


function AppWithApiKey() {
  const [apiKey, setApiKey] = React.useState(() => { try{return localStorage.getItem('ci_api_key')||'';}catch{return '';} });
  const [inputKey, setInputKey] = React.useState('');
  const [error, setError] = React.useState('');
  const [testing, setTesting] = React.useState(false);

  const handleSave = async () => {
    const key = inputKey.trim();
    if (!key.startsWith('sk-ant-')) { setError('La chiave deve iniziare con sk-ant-'); return; }
    setTesting(true); setError('');
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:10,messages:[{role:'user',content:'hi'}]})
      });
      if(res.status===401){setError('Chiave non valida, riprova.');return;}
      localStorage.setItem('ci_api_key',key); setApiKey(key);
    } catch(e){setError('Errore di rete: '+e.message);} finally{setTesting(false);}
  };

  React.useEffect(()=>{
    if(!apiKey) return;
    const orig = window._oF || window.fetch;
    window._oF = orig;
    window.fetch=(url,opts={})=>{
      if(typeof url==='string'&&url.includes('api.anthropic.com'))
        opts={...opts,headers:{...(opts.headers||{}),'x-api-key':apiKey,'anthropic-version':'2023-06-01'}};
      return orig(url,opts);
    };
    return ()=>{ window.fetch=window._oF; };
  },[apiKey]);

  if(!apiKey) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'var(--color-background-tertiary)',padding:'1rem'}}>
      <div style={{background:'var(--color-background-primary)',border:'0.5px solid var(--color-border-secondary)',borderRadius:'16px',padding:'2.5rem',width:'100%',maxWidth:'440px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'1.5rem'}}>
          <div style={{width:'28px',height:'28px',background:'#FFD700',borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{fontSize:'12px',fontWeight:700,color:'#1a1a1a'}}>PI</span>
          </div>
          <div>
            <div style={{fontSize:'15px',fontWeight:500,color:'var(--color-text-primary)'}}>Competitive Intelligence Radar</div>
            <div style={{fontSize:'11px',color:'var(--color-text-tertiary)'}}>Poste Italiane · Mail & Parcel · Bocconi 2026</div>
          </div>
        </div>
        <p style={{fontSize:'13px',color:'var(--color-text-secondary)',marginBottom:'1.25rem',lineHeight:1.6}}>
          Inserisci la tua Anthropic API key per usare il tool. Salvata solo nel tuo browser, mai condivisa.
        </p>
        <div style={{fontSize:'12px',color:'var(--color-text-secondary)',marginBottom:'8px'}}>
          Chiave gratuita su <a href="https://console.anthropic.com" target="_blank" rel="noreferrer" style={{color:'var(--color-text-info)'}}>console.anthropic.com</a>
        </div>
        <input type="password" value={inputKey} onChange={e=>{setInputKey(e.target.value);setError('');}}
          onKeyDown={e=>e.key==='Enter'&&!testing&&handleSave()} placeholder="sk-ant-api03-..."
          style={{width:'100%',padding:'10px 14px',marginBottom:'10px',fontSize:'13px',fontFamily:'monospace',borderRadius:'8px',border:'0.5px solid var(--color-border-secondary)',background:'var(--color-background-primary)',color:'var(--color-text-primary)'}}/>
        {error&&<div style={{fontSize:'12px',color:'var(--color-text-danger)',marginBottom:'10px'}}>{error}</div>}
        <button onClick={handleSave} disabled={testing||!inputKey}
          style={{width:'100%',padding:'10px',fontSize:'14px',fontWeight:500,border:'none',borderRadius:'8px',
            cursor:inputKey&&!testing?'pointer':'not-allowed',
            background:inputKey&&!testing?'#1a1a1a':'var(--color-background-secondary)',
            color:inputKey&&!testing?'#ffffff':'var(--color-text-tertiary)'}}>
          {testing?'Verifico...':'Salva chiave ed entra'}
        </button>
        <div style={{marginTop:'12px',fontSize:'11px',color:'var(--color-text-tertiary)',textAlign:'center'}}>
          La chiave rimane nel tuo browser · Non condivisa
        </div>
      </div>
    </div>
  );

  return (
    <div style={{padding:'1rem',maxWidth:'960px',margin:'0 auto'}}>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'4px'}}>
        <button onClick={()=>{localStorage.removeItem('ci_api_key');setApiKey('');}}
          style={{fontSize:'11px',color:'var(--color-text-tertiary)',background:'none',border:'none',cursor:'pointer',padding:'4px 8px'}}>
          Cambia API key
        </button>
      </div>
      <App/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppWithApiKey/>);
</script>
</body>
</html>
